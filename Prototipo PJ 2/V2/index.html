        function handleSearch(module, value) {
            state.searchQueries[module] = value.toLowerCase();
            render();
            const searchInput = document.getElementById(`search-${module}`);
            if (searchInput) {
                searchInput.focus();
                searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
            }
        }

        function showToast(message, type = 'success') {
            const colors = type === 'success' ? 'bg-slate-800' : 'bg-red-800';
            const toastHtml = `
                <div id="toast" class="fixed bottom-4 right-4 ${colors} text-white px-6 py-3 rounded-lg shadow-xl transform transition-all duration-300 translate-y-0 z-[999] flex items-center gap-2 border border-slate-700">
                    <i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}"></i>
                    <span class="text-sm font-medium">${message}</span>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', toastHtml);
            lucide.createIcons();
            setTimeout(() => {
                const t = document.getElementById('toast');
                if(t) {
                    t.classList.add('translate-y-20', 'opacity-0');
                    setTimeout(() => t.remove(), 300);
                }
            }, 3000);
        }

        function customAlert(message, title = 'Aviso') {
            const container = document.getElementById('custom-dialog-container') || createDialogContainer();
            container.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm overflow-y-auto h-full w-full z-[100] flex items-center justify-center p-4">
                    <div class="bg-white p-6 border border-slate-300 rounded-2xl shadow-2xl w-full max-w-sm transform scale-100 transition-all">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center flex-shrink-0">
                                <i data-lucide="info" class="w-5 h-5 text-slate-800"></i>
                            </div>
                            <h3 class="text-lg font-bold text-slate-900">${title}</h3>
                        </div>
                        <p class="text-sm text-slate-700 mb-6 leading-relaxed">${message}</p>
                        <div class="flex justify-end">
                            <button onclick="closeCustomDialog()" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2 rounded-xl shadow-sm text-sm font-medium transition-colors w-full sm:w-auto">Entendido</button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function customConfirm(message, title = 'Confirmação', isDanger = false) {
            return new Promise((resolve) => {
                const container = document.getElementById('custom-dialog-container') || createDialogContainer();
                const iconColor = isDanger ? 'text-red-700' : 'text-slate-800';
                const iconBg = isDanger ? 'bg-red-100' : 'bg-slate-200';
                const btnColor = isDanger ? 'bg-red-700 hover:bg-red-800' : 'bg-slate-900 hover:bg-slate-800';
                const iconName = isDanger ? 'alert-triangle' : 'help-circle';

                container.innerHTML = `
                    <div class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm overflow-y-auto h-full w-full z-[100] flex items-center justify-center p-4">
                        <div class="bg-white p-6 border border-slate-300 rounded-2xl shadow-2xl w-full max-w-sm transform scale-100 transition-all">
                            <div class="flex items-center gap-3 mb-4">
                                <div class="w-10 h-10 rounded-full ${iconBg} flex items-center justify-center flex-shrink-0">
                                    <i data-lucide="${iconName}" class="w-5 h-5 ${iconColor}"></i>
                                </div>
                                <h3 class="text-lg font-bold text-slate-900">${title}</h3>
                            </div>
                            <p class="text-sm text-slate-700 mb-6 leading-relaxed whitespace-pre-line">${message}</p>
                            <div class="flex flex-col sm:flex-row justify-end gap-3">
                                <button id="btn-dialog-cancel" class="bg-white border border-slate-300 rounded-xl shadow-sm px-5 py-2 text-sm font-medium text-slate-800 hover:bg-slate-100 transition-colors order-2 sm:order-1">Cancelar</button>
                                <button id="btn-dialog-confirm" class="${btnColor} text-white px-5 py-2 rounded-xl shadow-sm text-sm font-medium transition-colors order-1 sm:order-2">${isDanger ? 'Excluir' : 'Confirmar'}</button>
                            </div>
                        </div>
                    </div>
                `;
                lucide.createIcons();

                document.getElementById('btn-dialog-cancel').onclick = () => { closeCustomDialog(); resolve(false); };
                document.getElementById('btn-dialog-confirm').onclick = () => { closeCustomDialog(); resolve(true); };
            });
        }

        function createDialogContainer() {
            const div = document.createElement('div');
            div.id = 'custom-dialog-container';
            document.body.appendChild(div);
            return div;
        }

        function closeCustomDialog() {
            const container = document.getElementById('custom-dialog-container');
            if (container) container.innerHTML = '';
        }

        function maskCPF(event) {
            let input = event.target;
            let value = input.value.replace(/\D/g, ''); 
            if (value.length > 11) value = value.slice(0, 11); 
            if (value.length > 9) value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
            else if (value.length > 6) value = value.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
            else if (value.length > 3) value = value.replace(/(\d{3})(\d{1,3})/, "$1.$2");
            input.value = value;
        }

        function logActivity(acao, tipo) {
            if(!state.currentUser) return;
            const now = new Date();
            const formattedDate = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            DB.logs.unshift({
                id: DB.logs.length + 1,
                dataHora: formattedDate,
                usuarioNome: state.currentUser.nome,
                acao: acao,
                tipo: tipo
            });
        }

        function navigate(view) {
            state.currentView = view;
            state.mobileMenuOpen = false; 
            render();
        }

        function toggleMobileMenu() {
            state.mobileMenuOpen = !state.mobileMenuOpen;
            render();
        }

        function getLevelBadge(level) {
            if(level === 1) return `<span class="bg-red-100 text-red-800 text-xs font-bold px-2.5 py-0.5 rounded-lg border border-red-300">1 - Admin</span>`;
            if(level === 2) return `<span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-0.5 rounded-lg border border-blue-300">2 - Gerente</span>`;
            return `<span class="bg-gray-100 text-gray-800 text-xs font-bold px-2.5 py-0.5 rounded-lg border border-gray-300">Desconhecido</span>`;
        }

        function exportLogsPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(14);
            doc.text("SGAP - Registro Geral de Logs e Auditoria", 14, 15);
            doc.autoTable({ startY: 20, head: [['Data/Hora', 'Usuário', 'Tipo', 'Ação']], body: DB.logs.map(l => [l.dataHora, l.usuarioNome, l.tipo, l.acao]) });
            doc.save("SGAP_Logs.pdf");
            showToast("Relatório de Logs exportado em PDF!");
        }

        function exportProdutosPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('landscape');
    doc.setFontSize(14);
    doc.text("SGAP - Relatório Completo de Produtos Apreendidos", 14, 15);
    
    const head = [['ID', 'Item', 'Classificação', 'Localização', 'Data Apreensão', 'Motivo', 'Lote/Qtd', 'Status']];
    const body = DB.produtos.map(p => [
        p.id, 
        p.nome, 
        p.classificacao, 
        p.localizacao, 
        p.dataApreensao, 
        p.motivo, 
        p.emLote ? `Sim (${p.quantidade})` : 'Não (1)', 
        p.destino ? 'Destinado' : 'Em Depósito'
    ]);
    
    doc.autoTable({ startY: 20, head: head, body: body, styles: { fontSize: 8 } });
    doc.save("SGAP_Produtos.pdf");
    showToast("Relatório de Produtos exportado em PDF!");
}

function exportDestinacoesPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('landscape');
    doc.setFontSize(14);
    doc.text("SGAP - Relatório Completo de Destinações Ativas", 14, 15);
    
    const ativos = DB.produtos.filter(p => p.destino);
    const head = [['ID', 'Produto', 'Função', 'Local Destino', 'Associação', 'Custodiante', 'Data Atrib.', 'Status']];
    
    const body = ativos.map(p => {
        const userName = DB.users.find(u => u.id === parseInt(p.destino.usuarioId))?.nome || 'N/D';
        return [
            p.id, 
            p.nome,
            p.destino.funcao, 
            p.destino.local, 
            p.destino.associacao, 
            userName,
            p.destino.dataAtribuicao || 'N/D',
            p.destino.recebido ? 'Recebido' : 'Pendente',
        ];
    });
    
    doc.autoTable({ startY: 20, head: head, body: body, styles: { fontSize: 8 } });
    doc.save("SGAP_Destinacoes.pdf");
    showToast("Relatório de Destinações exportado em PDF!");
}

        function openModalClassificacao(id = null) {
            state.editingId = id;
            document.getElementById('formClassificacao').reset();
            const title = document.getElementById('modalClassTitle');
            if (id) {
                title.innerText = "Editar Categoria";
                const c = DB.classificacoes.find(x => x.id === id);
                document.getElementById('nc-nome').value = c.nome;
            } else {
                title.innerText = "Nova Categoria";
            }
            document.getElementById('modalClassificacao').classList.remove('hidden');
        }

        function handleSaveClassificacao(e) {
            e.preventDefault();
            const nome = document.getElementById('nc-nome').value;
            if (state.editingId) {
                const c = DB.classificacoes.find(x => x.id === state.editingId);
                if(c) {
                    logActivity(`Editou categoria ID ${c.id}: ${nome}`, 'Edição Classificação');
                    c.nome = nome;
                    showToast('Categoria atualizada com sucesso.');
                }
            } else {
                DB.classificacoes.push({
                    id: DB.classificacoes.length > 0 ? Math.max(...DB.classificacoes.map(x=>x.id)) + 1 : 1,
                    nome: nome
                });
                logActivity(`Cadastrou nova categoria: ${nome}`, 'Cadastro Classificação');
                showToast('Categoria criada com sucesso.');
            }
            document.getElementById('modalClassificacao').classList.add('hidden');
            render();
        }

        async function deleteClassificacao(id) {
            const confirmed = await customConfirm("Tem certeza que deseja excluir esta categoria permanentemente?", "Excluir Categoria", true);
            if (confirmed) {
                DB.classificacoes = DB.classificacoes.filter(c => c.id !== id);
                logActivity(`Removeu categoria ID ${id}`, 'Exclusão Classificação');
                showToast("Categoria removida.");
                render();
            }
        }


        function handleLogin(e) {
            e.preventDefault();
            const doc = document.getElementById('loginDoc').value;
            const senha = document.getElementById('loginSenha').value;
            const btn = document.getElementById('btn-login');
            
            btn.innerHTML = '<div class="loader mx-auto"></div>';
            btn.disabled = true;

            setTimeout(() => { 
                const user = DB.users.find(u => u.rg === doc && u.senha === senha);
                if (user) {
                    if (user.bloqueado) {
                        customAlert("ERRO: Usuário bloqueado no sistema. Contate a administração.", "Acesso Recusado");
                        btn.innerHTML = 'Acessar Sistema';
                        btn.disabled = false;
                        return;
                    }
                    state.currentUser = user;
                    logActivity(`Login efetuado no sistema`, 'Acesso');
                    navigate('dashboard');
                    showToast('Autenticação validada!');
                } else {
                    customAlert("Documento ou senha incorretos.", "Erro ao Autenticar");
                    btn.innerHTML = 'Acessar Sistema';
                    btn.disabled = false;
                }
            }, 800);
        }

        function handleLogout() {
            logActivity(`Logout efetuado do sistema`, 'Acesso');
            state.currentUser = null;
            navigate('login');
        }

        function toggleBlockUser(id) {
            const user = DB.users.find(u => u.id === id);
            if(user) {
                user.bloqueado = !user.bloqueado;
                logActivity(`${user.bloqueado ? 'Bloqueou' : 'Desbloqueou'} o usuário ID ${id} (${user.nome})`, 'Bloqueio');
                showToast(`Status do usuário alterado com sucesso.`);
                render(); 
            }
        }

        function openModalUser(id = null) {
            state.editingId = id;
            
            const step1 = document.getElementById('user-step-1');
            const step2 = document.getElementById('formUser');
            const title = document.getElementById('modalUserTitle');
            
            if (id) {
                // Edição: Pula a etapa 1 de associação
                const u = DB.users.find(x => x.id === id);
                title.innerText = "Editar Usuário";
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                
                document.getElementById('nu-assoc').value = u.associacao;
                document.getElementById('nu-assoc-display').value = u.associacao;
                
                document.getElementById('nu-nome').value = u.nome;
                document.getElementById('nu-rg').value = u.rg;
                document.getElementById('nu-senha').value = u.senha;
                document.getElementById('nu-nivel').value = u.nivel;
                document.getElementById('nu-local').value = u.local;
            } else {
                // Cadastro: Reseta e mostra Etapa 1
                document.getElementById('formUser').reset();
                title.innerText = "Cadastrar Novo Usuário";
                step1.classList.remove('hidden');
                step2.classList.add('hidden');
                document.getElementById('nu-assoc-select').value = "";
            }
            document.getElementById('modalUser').classList.remove('hidden');

        function proceedToUserForm() {
            const select = document.getElementById('nu-assoc-select');
            if(!select.value) {
                return showToast("Selecione uma instituição para continuar.", "error");
            }
            
            // Passa o valor para os inputs da etapa 2
            document.getElementById('nu-assoc').value = select.value;
            document.getElementById('nu-assoc-display').value = select.value;
            
            // Troca de tela
            document.getElementById('user-step-1').classList.add('hidden');
            document.getElementById('formUser').classList.remove('hidden');

        async function deleteUser(id) {
            if(id === state.currentUser.id) return showToast("Ação inválida: você está logado nesta conta.", "error");
            
            const confirmed = await customConfirm("Tem certeza que deseja remover este usuário permanentemente?", "Excluir Usuário", true);
            if(confirmed) {
                DB.users = DB.users.filter(u => u.id !== id);
                logActivity(`Removeu o usuário ID ${id}`, 'Exclusão');
                showToast('Usuário removido com sucesso.');
                render();
            }
        }

        function handleSaveUser(e) {
            e.preventDefault();
            const nome = document.getElementById('nu-nome').value;
            const nivel = parseInt(document.getElementById('nu-nivel').value);
            const senha = document.getElementById('nu-senha').value;
            const associacao = document.getElementById('nu-assoc').value;
            
            if (state.editingId) {
                const u = DB.users.find(x => x.id === state.editingId);
                if(u) {
                    u.nome = nome;
                    u.rg = document.getElementById('nu-rg').value;
                    u.senha = senha;
                    u.nivel = nivel;
                    u.local = document.getElementById('nu-local').value;
                    logActivity(`Editou usuário ID ${u.id}: ${nome}`, 'Edição');
                    showToast('Usuário atualizado com sucesso.');
                }
            } else {
                DB.users.push({
                    id: DB.users.length > 0 ? Math.max(...DB.users.map(u=>u.id)) + 1 : 1,
                    nome: nome,
                    rg: document.getElementById('nu-rg').value,
                    senha: senha,
                    nivel: nivel,
                    bloqueado: false,
                    foto: "",
                    associacao: associacao,
                    local: document.getElementById('nu-local').value,
                    criacao: new Date().toISOString().split('T')[0]
                });
                logActivity(`Cadastrou novo usuário: ${nome} (Nível ${nivel})`, 'Cadastro');
                showToast('Usuário cadastrado com sucesso.');
            }
            document.getElementById('modalUser').classList.add('hidden');
            render();
        }

        function openModalAssociacao(id = null) {
            state.editingId = id;
            document.getElementById('formAssociacao').reset();
            const title = document.getElementById('modalAssociacaoTitle');
            if (id) {
                const a = DB.associacoes.find(x => x.id === id);
                title.innerText = "Editar Associação/Órgão";
                document.getElementById('na-nome').value = a.nome;
                document.getElementById('na-ramo').value = a.ramo;
                document.getElementById('na-lider').value = a.lider;
                document.getElementById('na-local-op').value = a.localOperacao;
                document.getElementById('na-local-fund').value = a.localFundacao;
                document.getElementById('na-lucrativo').checked = a.lucrativo;
            } else {
                title.innerText = "Cadastrar Associação/Órgão";
            }
            document.getElementById('modalAssociacao').classList.remove('hidden');
        }

        function handleSaveAssociacao(e) {
            e.preventDefault();
            const nome = document.getElementById('na-nome').value;
            const ramo = document.getElementById('na-ramo').value;
            const lider = document.getElementById('na-lider').value;
            const localOp = document.getElementById('na-local-op').value;
            const localFund = document.getElementById('na-local-fund').value;
            const lucrativo = document.getElementById('na-lucrativo').checked;

            if (state.editingId) {
                const a = DB.associacoes.find(x => x.id === state.editingId);
                if(a) {
                    a.nome = nome;
                    a.ramo = ramo;
                    a.lider = lider;
                    a.localOperacao = localOp;
                    a.localFundacao = localFund;
                    a.lucrativo = lucrativo;
                    logActivity(`Editou Associação ID ${a.id}: ${nome}`, 'Edição Associação');
                    showToast('Instituição atualizada com sucesso.');
                }
            } else {
                DB.associacoes.push({
                    id: DB.associacoes.length > 0 ? Math.max(...DB.associacoes.map(a=>a.id)) + 1 : 1,
                    nome: nome,
                    ramo: ramo,
                    lider: lider,
                    localOperacao: localOp,
                    localFundacao: localFund,
                    lucrativo: lucrativo,
                    preCadastrado: false
                });
                logActivity(`Cadastrou Associação: ${nome}`, 'Cadastro Associação');
                showToast('Instituição cadastrada com sucesso.');
            }
            document.getElementById('modalAssociacao').classList.add('hidden');
            render();
        }

        async function deleteAssociacao(id) {
            if(state.currentUser.nivel !== 1) return showToast("Acesso Negado: Apenas Administradores podem remover associações.", "error");
            
            const a = DB.associacoes.find(x => x.id === id);
            if(a && a.preCadastrado) {
                return showToast("Acesso Negado: Instituições pré-cadastradas não podem ser removidas.", "error");
            }

            const confirmed = await customConfirm("Tem certeza que deseja remover esta associação permanentemente?", "Excluir Instituição", true);
            if(confirmed) {
                DB.associacoes = DB.associacoes.filter(x => x.id !== id);
                logActivity(`Removeu a associação ID ${id}`, 'Exclusão Associação');
                showToast('Instituição removida com sucesso.');
                render();
            }
        }

        function openModalProduto(id = null) {
            state.editingId = id;
            document.getElementById('formProduto').reset();
            const title = document.getElementById('modalProdutoTitle');
            if (id) {
                const p = DB.produtos.find(x => x.id === id);
                title.innerText = "Editar Produto Apreendido";
                document.getElementById('np-nome').value = p.nome;
                document.getElementById('np-class').value = p.classificacao;
                document.getElementById('np-data').value = p.dataApreensao;
                document.getElementById('np-local').value = p.localizacao;
                document.getElementById('np-motivo').value = p.motivo;
                document.getElementById('np-lote').checked = p.emLote;
                document.getElementById('np-qtd-container').classList.toggle('hidden', !p.emLote);
                document.getElementById('np-qtd').value = p.quantidade;
            } else {
                title.innerText = "Registrar Produto Apreendido";
                document.getElementById('np-qtd-container').classList.add('hidden');
            }
            document.getElementById('modalProduto').classList.remove('hidden');
        }

        async function deleteProduto(id) {
            const confirmed = await customConfirm("Tem certeza que deseja remover este produto permanentemente?", "Excluir Produto", true);
            if(confirmed) {
                DB.produtos = DB.produtos.filter(p => p.id !== id);
                logActivity(`Removeu o produto ID ${id}`, 'Exclusão Produto');
                showToast('Produto removido com sucesso.');
                render();
            }
        }

        function handleSaveProduto(e) {
            e.preventDefault();
            const isLote = document.getElementById('np-lote').checked;
            const nome = document.getElementById('np-nome').value;
            if (state.editingId) {
                const p = DB.produtos.find(x => x.id === state.editingId);
                if(p) {
                    p.nome = nome;
                    p.classificacao = document.getElementById('np-class').value;
                    p.localizacao = document.getElementById('np-local').value;
                    p.dataApreensao = document.getElementById('np-data').value;
                    p.motivo = document.getElementById('np-motivo').value;
                    p.emLote = isLote;
                    p.quantidade = isLote ? document.getElementById('np-qtd').value : 1;
                    logActivity(`Editou produto ID ${p.id}: ${nome}`, 'Edição Produto');
                    showToast('Produto atualizado com sucesso.');
                }
            } else {
                DB.produtos.push({
                    id: Math.floor(Math.random() * 100000), // Completando a ID truncada no código original
                    nome: nome,
                    classificacao: document.getElementById('np-class').value,
                    localizacao: document.getElementById('np-local').value,
                    dataApreensao: document.getElementById('np-data').value,
                    motivo: document.getElementById('np-motivo').value,
                    emLote: isLote,
                    quantidade: isLote ? document.getElementById('np-qtd').value : 1,
                    destino: null
                });
                logActivity(`Cadastrou produto: ${nome}`, 'Cadastro Produto');
                showToast('Produto registrado com sucesso.');
            }
            document.getElementById('modalProduto').classList.add('hidden');
            render();
        }

        function openModalDestino(id, isEdit = false) {
            const p = DB.produtos.find(x => x.id === id);
            if(!p) return;
            document.getElementById('formDestino').reset();
            document.getElementById('nd-prodId').value = p.id;
            document.getElementById('nd-prodInfo').innerHTML = `<strong>Produto:</strong> ${p.nome} <br> <strong>Classe:</strong> ${p.classificacao} ${p.emLote ? `(${p.quantidade} un)` : ''}`;
            
            if (isEdit && p.destino) {
                document.getElementById('nd-funcao').value = p.destino.funcao;
                document.getElementById('nd-local').value = p.destino.local;
                document.getElementById('nd-user').value = p.destino.usuarioId;
            }
            
            document.getElementById('modalDestino').classList.remove('hidden');
        }

        function handleSaveDestino(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('nd-prodId').value);
            const p = DB.produtos.find(x => x.id === id);
            const userId = parseInt(document.getElementById('nd-user').value);
            const user = DB.users.find(u => u.id === userId);
            
            if(p && user) {
                p.destino = {
                    funcao: document.getElementById('nd-funcao').value,
                    local: document.getElementById('nd-local').value,
                    usuarioId: userId,
                    associacao: user.associacao,
                    recebido: p.destino ? p.destino.recebido : false,
                    dataAtribuicao: p.destino ? p.destino.dataAtribuicao : new Date().toLocaleDateString('pt-BR')
                };
                logActivity(`Configurou destinação para o produto ID ${id}`, 'Destinação');
                showToast('Destinação salva com sucesso.');
                document.getElementById('modalDestino').classList.add('hidden');
                render();
            }
        }

        function openViewDestinoModal(id) {
            const p = DB.produtos.find(x => x.id === id);
            if(!p || !p.destino) return;
            const user = DB.users.find(u => u.id === p.destino.usuarioId);
            
            const html = `
                <div class="space-y-3">
                    <p class="text-sm"><strong>Função:</strong> ${p.destino.funcao}</p>
                    <p class="text-sm"><strong>Local:</strong> ${p.destino.local}</p>
                    <p class="text-sm"><strong>Atribuído a:</strong> ${user ? user.nome : 'Desconhecido'} (${p.destino.associacao})</p>
                    <p class="text-sm"><strong>Data Atribuição:</strong> ${p.destino.dataAtribuicao}</p>
                    <p class="text-sm"><strong>Período Checagem:</strong> ${p.destino.periodoChecagem}</p>
                    <p class="text-sm"><strong>Status:</strong> ${p.destino.recebido ? 'Recebido' : 'Em Trânsito/Pendente'}</p>
                </div>
            `;
            document.getElementById('viewDestinoContent').innerHTML = html;
            document.getElementById('modalViewDestino').classList.remove('hidden');
        }

        async function deleteDestino(id) {
            const confirmed = await customConfirm("Tem certeza que deseja revogar esta destinação?", "Revogar Destinação", true);
            if(confirmed) {
                const p = DB.produtos.find(x => x.id === id);
                if(p) {
                    p.destino = null;
                    logActivity(`Revogou destinação do produto ID ${id}`, 'Revogação');
                    showToast('Destinação revogada com sucesso.');
                    render();
                }
            }
        }

        function marcarRecebido(id) {
            const p = DB.produtos.find(x => x.id === id);
            if(p && p.destino) {
                p.destino.recebido = true;
                logActivity(`Marcou produto ID ${id} como recebido`, 'Recebimento');
                showToast('Produto marcado como recebido.');
                render();
            }
        }

        function render() {
            const container = document.getElementById('app-container');
            if (state.currentView === 'login' || !state.currentUser) {
                container.innerHTML = renderLogin();
            } else {
                let content = '';
                if (state.currentView === 'dashboard') content = renderDashboard();
                else if (state.currentView === 'usuarios') content = renderUsuarios();
                else if (state.currentView === 'produtos') content = renderProdutos();
                else if (state.currentView === 'associacoes') content = renderAssociacoes();
                else if (state.currentView === 'destinacao') content = renderDestinacao();
                else if (state.currentView === 'auditoria') content = renderAuditoria();
                else if (state.currentView === 'classificacoes') content = renderClassificacoes();
                
                container.innerHTML = renderSidebar() + content;
            }
            lucide.createIcons();
        }

        // Inicializa o Aplicativo
        render();

        if(isEdit && p.destino) {
            document.getElementById('nd-funcao').value = p.destino.funcao;
            document.getElementById('nd-local').value = p.destino.local;
            document.getElementById('nd-user').value = p.destino.usuarioId;
        }
        document.getElementById('modalDestino').classList.remove('hidden');
    

    function handleSaveDestino(e) {
        e.preventDefault();
        const prodId = parseInt(document.getElementById('nd-prodId').value);
        const p = DB.produtos.find(x => x.id === prodId);
        if(p) {
            const userId = parseInt(document.getElementById('nd-user').value);
            const user = DB.users.find(u => u.id === userId);
            p.destino = {
                local: document.getElementById('nd-local').value,
                funcao: document.getElementById('nd-funcao').value,
                usuarioId: userId,
                associacao: user ? user.associacao : 'Desconhecida',
                recebido: p.destino ? p.destino.recebido : false,
                provaRecebimento: p.destino ? p.destino.provaRecebimento : null,
                dataAtribuicao: p.destino && p.destino.dataAtribuicao ? p.destino.dataAtribuicao : new Date().toLocaleDateString('pt-BR')
            };
            logActivity(`Atribuiu/Editou destinação do produto ID ${p.id}`, 'Destinação');
            showToast('Destinação salva com sucesso.');
        }
        document.getElementById('modalDestino').classList.add('hidden');
        render(); // Chame a função que renderiza a View atual
    }

    async function deleteDestino(id) {
        const confirmed = await customConfirm("Tem certeza que deseja revogar esta destinação?", "Revogar Destinação", true);
        if(confirmed) {
            const p = DB.produtos.find(x => x.id === id);
            if(p) { 
                p.destino = null; 
                logActivity(`Revogou destinação do produto ID ${id}`, 'Destinação'); 
                showToast('Destinação revogada com sucesso.'); 
                render(); 
            }
        }
    }

    // Função modificada para exigir Prova de Recebimento
    function abrirModalRecebimento(id) {
    const p = DB.produtos.find(x => x.id === id);
    if(!p || !p.destino) return;
    
    document.getElementById('formRecebimento').reset();
    document.getElementById('nr-prodId').value = p.id;
    document.getElementById('nr-prodInfo').innerHTML = `<strong>Confirmando entrega de:</strong> ${p.nome}`;
    
    // Reseta o preview da imagem
    const preview = document.getElementById('nr-preview');
    preview.src = '';
    preview.classList.add('hidden');
    
    document.getElementById('modalRecebimento').classList.remove('hidden');
    lucide.createIcons();
}

function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function() {
        const preview = document.getElementById('nr-preview');
        preview.src = reader.result;
        preview.classList.remove('hidden');
    }
    if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
    }
}

function handleSalvarRecebimento(e) {
    e.preventDefault();
    const id = parseInt(document.getElementById('nr-prodId').value);
    const p = DB.produtos.find(x => x.id === id);
    
    if(p && p.destino) {
        p.destino.recebido = true;
        // Simulando o armazenamento da imagem em Base64 e das observações
        p.destino.provaRecebimento = document.getElementById('nr-preview').src;
        p.destino.observacoesEntrega = document.getElementById('nr-obs').value;
        p.destino.dataRecebimento = new Date().toLocaleDateString('pt-BR');
        
        logActivity(`Confirmou o recebimento do produto ID ${id} com anexo visual`, 'Recebimento');
        showToast('Recebimento e comprovante registrados com sucesso!');
        
        document.getElementById('modalRecebimento').classList.add('hidden');
        render();
    }
}

    // Modal de Detalhes atualizado para exibir a Prova
   function openViewDestinoModal(id) {
    const p = DB.produtos.find(x => x.id === id);
    if (!p || !p.destino) return;

    const custodiante = DB.users.find(u => u.id === parseInt(p.destino.usuarioId))?.nome || 'Não Localizado';

    let contentHtml = `
        <div class="space-y-2 mb-4">
            <p class="text-sm text-slate-700"><strong>Produto:</strong> <span class="text-slate-900">${p.nome}</span></p>
            <p class="text-sm text-slate-700"><strong>Local de Destino:</strong> <span class="text-slate-900">${p.destino.local}</span></p>
            <p class="text-sm text-slate-700"><strong>Custodiante:</strong> <span class="text-slate-900">${custodiante}</span></p>
            <p class="text-sm text-slate-700"><strong>Função:</strong> <span class="text-slate-900">${p.destino.funcao}</span></p>
        </div>
    `;

    // Se o produto já foi recebido, mostra os dados da prova de recebimento
    if (p.destino.recebido) {
        contentHtml += `
            <div class="mt-4 p-4 bg-emerald-50 rounded-xl border border-emerald-200">
                <h4 class="font-bold text-emerald-800 mb-3 flex items-center gap-2">
                    <i data-lucide="check-circle" class="w-4 h-4"></i> Confirmação de Recebimento
                </h4>
                
                <div class="mb-3">
                    <strong class="text-sm text-slate-800 block mb-1">Observações do Recebedor:</strong>
                    <p class="text-sm text-slate-600 bg-white p-2 rounded-lg border border-emerald-100">
                        ${p.destino.observacoesEntrega ?  p.destino.observacoesEntrega: '<em class="text-slate-400">Nenhuma observação registrada.</em>'}
                    </p>
                </div>

                <div>
                    <strong class="text-sm text-slate-800 block mb-2">Prova de Recebimento (Imagem):</strong>
                    ${p.destino.provaRecebimento 
                        ? `<img src="${p.destino.provaRecebimento}" alt="Prova de Recebimento" class="w-full h-auto max-h-64 object-contain rounded-xl border border-slate-300 shadow-sm bg-white p-1">` 
                        : `<p class="text-sm text-slate-500 italic">Nenhuma imagem anexada.</p>`
                    }
                </div>
            </div>
        `;
    }

    document.getElementById('viewDestinoContent').innerHTML = contentHtml;
    document.getElementById('modalViewDestino').classList.remove('hidden');
    lucide.createIcons(); // Recria os ícones dentro do novo HTML
}
    
    </script>

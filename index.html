<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGAP - Sistema de Gestão e Aplicação de Produtos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Bibliotecas para Exportação PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #e2e8f0; /* bg-slate-200 para uma base mais escura */
        }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Loading spinner */
        .loader {
            border: 3px solid #cbd5e1;
            border-top: 3px solid #334155;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-900 antialiased min-h-screen flex flex-col">

    <!-- Container Principal do App -->
    <div id="app-container" class="w-full h-screen flex overflow-hidden"></div>

    <!-- Scripts de Lógica e Renderização -->
    <script>
        const DB = {
            users: [
                { id: 1, nome: "Inspetor Chefe", rg: "111.111.111-11", senha: "admin", nivel: 3, bloqueado: false, foto: "", associacao: "Governo Federal", local: "Brasília/DF", criacao: "2023-01-10" },
                { id: 2, nome: "Agente Silva", rg: "222.222.222-22", senha: "123", nivel: 2, bloqueado: false, foto: "", associacao: "Polícia Civil", local: "São Paulo/SP", criacao: "2023-05-20" },
                { id: 3, nome: "Operador de Campo", rg: "333.333.333-33", senha: "123", nivel: 1, bloqueado: false, foto: "", associacao: "Empresa Local X", local: "Rio de Janeiro/RJ", criacao: "2023-10-05" }
            ],
            associacoes: [
                { id: 1, nome: "Governo Federal (Receita)", ramo: "Governamental", lucrativo: false, localFundacao: "Brasília", lider: "Ministro da Fazenda", localOperacao: "Nacional", preCadastrado: true },
                { id: 2, nome: "ONG Vida Tech", ramo: "Educação Tecnológica", lucrativo: false, localFundacao: "São Paulo", lider: "Maria Oliveira", localOperacao: "São Paulo", preCadastrado: false }
            ],
            produtos: [
                { id: 101, nome: "Lote de Notebooks Dell", classificacao: "Eletrônico", localizacao: "Galpão Central - SP", dataApreensao: "2024-03-15", motivo: "Descaminho", emLote: true, quantidade: 50, destino: null },
                { id: 102, nome: "Caminhão de Bebidas Destiladas", classificacao: "Bebida", localizacao: "Pátio Receita - PR", dataApreensao: "2024-04-10", motivo: "Falsificação", emLote: true, quantidade: 5000, destino: { local: "Destruição/Reciclagem PR", funcao: "Descarte ecológico", usuarioId: 2, associacao: "Polícia Civil", periodoChecagem: "Único", recebido: false, dataAtribuicao: "20/04/2024" } }
            ],
            logs: [
                { id: 1, dataHora: "2024-04-20 08:00", usuarioNome: "Inspetor Chefe", acao: "Login no sistema via IP 192.168.0.1", tipo: "Acesso" },
                { id: 2, dataHora: "2024-04-20 09:30", usuarioNome: "Agente Silva", acao: "Atribuiu destino ao produto ID 102", tipo: "Destinação" }
            ]
        };

        const state = {
            currentUser: null,
            currentView: 'login', 
            toast: null,
            editingId: null,
            mobileMenuOpen: false
        };

        function showToast(message, type = 'success') {
            const colors = type === 'success' ? 'bg-slate-800' : 'bg-red-800';
            const toastHtml = `
                <div id="toast" class="fixed bottom-4 right-4 ${colors} text-white px-6 py-3 rounded-lg shadow-xl transform transition-all duration-300 translate-y-0 z-50 flex items-center gap-2 border border-slate-700">
                    <i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}"></i>
                    <span class="text-sm font-medium">${message}</span>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', toastHtml);
            lucide.createIcons();
            setTimeout(() => {
                const t = document.getElementById('toast');
                if(t) {
                    t.classList.add('translate-y-20', 'opacity-0');
                    setTimeout(() => t.remove(), 300);
                }
            }, 3000);
        }

        function customAlert(message, title = 'Aviso') {
            const container = document.getElementById('custom-dialog-container') || createDialogContainer();
            container.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm overflow-y-auto h-full w-full z-[100] flex items-center justify-center p-4">
                    <div class="bg-white p-6 border border-slate-300 rounded-2xl shadow-2xl w-full max-w-sm transform scale-100 transition-all">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center flex-shrink-0">
                                <i data-lucide="info" class="w-5 h-5 text-slate-800"></i>
                            </div>
                            <h3 class="text-lg font-bold text-slate-900">${title}</h3>
                        </div>
                        <p class="text-sm text-slate-700 mb-6 leading-relaxed">${message}</p>
                        <div class="flex justify-end">
                            <button onclick="closeCustomDialog()" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2 rounded-xl shadow-sm text-sm font-medium transition-colors w-full sm:w-auto">Entendido</button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function customConfirm(message, title = 'Confirmação', isDanger = false) {
            return new Promise((resolve) => {
                const container = document.getElementById('custom-dialog-container') || createDialogContainer();
                const iconColor = isDanger ? 'text-red-700' : 'text-slate-800';
                const iconBg = isDanger ? 'bg-red-100' : 'bg-slate-200';
                const btnColor = isDanger ? 'bg-red-700 hover:bg-red-800' : 'bg-slate-900 hover:bg-slate-800';
                const iconName = isDanger ? 'alert-triangle' : 'help-circle';

                container.innerHTML = `
                    <div class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm overflow-y-auto h-full w-full z-[100] flex items-center justify-center p-4">
                        <div class="bg-white p-6 border border-slate-300 rounded-2xl shadow-2xl w-full max-w-sm transform scale-100 transition-all">
                            <div class="flex items-center gap-3 mb-4">
                                <div class="w-10 h-10 rounded-full ${iconBg} flex items-center justify-center flex-shrink-0">
                                    <i data-lucide="${iconName}" class="w-5 h-5 ${iconColor}"></i>
                                </div>
                                <h3 class="text-lg font-bold text-slate-900">${title}</h3>
                            </div>
                            <p class="text-sm text-slate-700 mb-6 leading-relaxed whitespace-pre-line">${message}</p>
                            <div class="flex flex-col sm:flex-row justify-end gap-3">
                                <button id="btn-dialog-cancel" class="bg-white border border-slate-300 rounded-xl shadow-sm px-5 py-2 text-sm font-medium text-slate-800 hover:bg-slate-100 transition-colors order-2 sm:order-1">Cancelar</button>
                                <button id="btn-dialog-confirm" class="${btnColor} text-white px-5 py-2 rounded-xl shadow-sm text-sm font-medium transition-colors order-1 sm:order-2">${isDanger ? 'Excluir' : 'Confirmar'}</button>
                            </div>
                        </div>
                    </div>
                `;
                lucide.createIcons();

                document.getElementById('btn-dialog-cancel').onclick = () => {
                    closeCustomDialog();
                    resolve(false);
                };
                document.getElementById('btn-dialog-confirm').onclick = () => {
                    closeCustomDialog();
                    resolve(true);
                };
            });
        }

        function createDialogContainer() {
            const div = document.createElement('div');
            div.id = 'custom-dialog-container';
            document.body.appendChild(div);
            return div;
        }

        function closeCustomDialog() {
            const container = document.getElementById('custom-dialog-container');
            if (container) container.innerHTML = '';
        }

        function maskCPF(event) {
            let input = event.target;
            let value = input.value.replace(/\D/g, ''); 
            if (value.length > 11) value = value.slice(0, 11); 

            if (value.length > 9) {
                value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
            } else if (value.length > 6) {
                value = value.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
            } else if (value.length > 3) {
                value = value.replace(/(\d{3})(\d{1,3})/, "$1.$2");
            }
            input.value = value;
        }

        function logActivity(acao, tipo) {
            if(!state.currentUser) return;
            const now = new Date();
            const formattedDate = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            DB.logs.unshift({
                id: DB.logs.length + 1,
                dataHora: formattedDate,
                usuarioNome: state.currentUser.nome,
                acao: acao,
                tipo: tipo
            });
        }

        function navigate(view) {
            state.currentView = view;
            state.mobileMenuOpen = false; 
            render();
        }

        function toggleMobileMenu() {
            state.mobileMenuOpen = !state.mobileMenuOpen;
            render();
        }

        function getLevelBadge(level) {
            if(level === 3) return `<span class="bg-red-100 text-red-800 text-xs font-bold px-2.5 py-0.5 rounded-lg border border-red-300">Alto (Admin)</span>`;
            if(level === 2) return `<span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-0.5 rounded-lg border border-amber-300">Médio (Agente)</span>`;
            return `<span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-0.5 rounded-lg border border-emerald-300">Baixo (Operador)</span>`;
        }

        function exportLogsPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(14);
            doc.text("SGAP - Registro Geral de Logs e Auditoria", 14, 15);
            doc.autoTable({
                startY: 20,
                head: [['Data/Hora', 'Usuário', 'Tipo', 'Ação']],
                body: DB.logs.map(l => [l.dataHora, l.usuarioNome, l.tipo, l.acao])
            });
            doc.save("SGAP_Logs.pdf");
            showToast("Relatório de Logs exportado em PDF!");
        }

        function exportProdutosPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(14);
            doc.text("SGAP - Relatório de Produtos Apreendidos", 14, 15);
            doc.autoTable({
                startY: 20,
                head: [['ID', 'Item', 'Classificação', 'Data Apreensão', 'Status']],
                body: DB.produtos.map(p => [p.id, p.nome, p.classificacao, p.dataApreensao, p.destino ? 'Destinado' : 'Em Depósito'])
            });
            doc.save("SGAP_Produtos.pdf");
            showToast("Relatório de Produtos exportado em PDF!");
        }

        function exportDestinacoesPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(14);
            doc.text("SGAP - Relatório de Destinações Ativas", 14, 15);
            const ativos = DB.produtos.filter(p => p.destino);
            doc.autoTable({
                startY: 20,
                head: [['ID Produto', 'Função', 'Local Destino', 'Associação', 'Status']],
                body: ativos.map(p => [p.id, p.destino.funcao, p.destino.local, p.destino.associacao, p.destino.recebido ? 'Recebido' : 'Pendente'])
            });
            doc.save("SGAP_Destinacoes.pdf");
            showToast("Relatório de Destinações exportado em PDF!");
        }

                <div class="bg-slate-900 p-6 sm:p-8 text-center text-white">
                    <div class="mx-auto w-14 h-14 sm:w-16 sm:h-16 bg-slate-800 rounded-2xl flex items-center justify-center mb-4 shadow-lg border border-slate-700">
                        <i data-lucide="shield-check" class="w-7 h-7 sm:w-8 sm:h-8 text-slate-200"></i>

                    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-100">

                                    class="pl-10 block w-full border border-slate-300 rounded-xl shadow-sm py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:border-slate-500 text-sm text-slate-900"

        function renderSidebar() {
            const userLevel = state.currentUser.nivel;
            return `

                                        <select id="nd-user" required class="block w-full border border-slate-300 rounded-xl shadow-sm py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-slate-500 text-sm text-slate-900">
                                            <option value="">Selecione...</option>
                                            ${DB.users.filter(u => !u.bloqueado).map(u => `<option value="${u.id}">${u.nome} (${u.associacao})</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-slate-800 mb-1">Período de Checagem</label>
                                        <select id="nd-periodo" class="block w-full border border-slate-300 rounded-xl shadow-sm py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-slate-500 text-sm text-slate-900">
                                            <option>Semanal</option><option>Mensal</option><option>Semestral</option><option>Anual</option><option>Único (Consumo/Descarte)</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="mt-5 flex flex-col sm:flex-row justify-end gap-3 pt-4 border-t border-slate-200">
                                    <button type="button" onclick="document.getElementById('modalDestino').classList.add('hidden')" class="bg-white border border-slate-300 rounded-xl shadow-sm py-2.5 px-4 text-sm font-bold text-slate-800 hover:bg-slate-100 order-2 sm:order-1 transition-colors">Cancelar</button>
                                    <button type="submit" class="bg-slate-900 border border-transparent rounded-xl shadow-md py-2.5 px-4 text-sm font-bold text-white hover:bg-slate-800 order-1 sm:order-2 transition-colors">Confirmar Edição</button>
                                </div>
                            </form>
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;
        }

        function renderAuditoria() {
            if(state.currentUser.nivel < 3) return renderDashboard();

            return `
                <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-hidden">
                    ${renderTopbar('Auditoria de Acesso e Operações')}
                    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
                        <div class="bg-white shadow-sm rounded-2xl overflow-hidden border border-slate-300">
                            <div class="px-6 py-5 border-b border-slate-200 bg-slate-100 flex flex-col sm:flex-row justify-between sm:items-center gap-3">
                                <div>
                                    <h3 class="text-base font-bold text-slate-900">Registro de Atividades</h3>
                                    <p class="text-xs text-slate-600 mt-0.5">Listagem unificada de ações de usuários auditadas de forma automática.</p>
                                </div>
                                <button onclick="exportLogsPDF()" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-800 px-4 py-2.5 rounded-xl shadow-sm text-sm font-bold flex items-center justify-center gap-2 transition-colors shrink-0">
                                    <i data-lucide="file-down" class="w-4 h-4"></i> Exportar Logs PDF
                                </button>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="min-w-full divide-y divide-slate-300">
                                    <thead class="bg-slate-50">
                                        <tr>
                                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-700 uppercase tracking-wider">Data/Hora</th>
                                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-700 uppercase tracking-wider">Usuário</th>
                                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-700 uppercase tracking-wider">Módulo</th>
                                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-700 uppercase tracking-wider">Ação / Detalhes</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white divide-y divide-slate-200">
                                        ${DB.logs.map(log => `
                                            <tr class="hover:bg-slate-50 transition-colors">
                                                <td class="px-6 py-4 whitespace-nowrap text-xs text-slate-600 font-mono font-bold">${log.dataHora}</td>
                                                <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-slate-900">${log.usuarioNome}</td>
                                                <td class="px-6 py-4 whitespace-nowrap text-xs">
                                                    <span class="px-2.5 py-1 inline-flex text-[10px] leading-5 font-bold rounded-lg bg-slate-200 text-slate-800 border border-slate-300">${log.tipo}</span>
                                                </td>
                                                <td class="px-6 py-4 text-xs font-medium text-slate-700 leading-relaxed">${log.acao}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function openViewDestinoModal(id) {
            const p = DB.produtos.find(x => x.id === id);
            if(!p || !p.destino) return;
            
            const resp = DB.users.find(u => u.id === p.destino.usuarioId);
            
            const content = `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2 bg-slate-100 p-4 rounded-xl border border-slate-200 shadow-inner">
                        <p class="text-[10px] text-slate-500 uppercase font-extrabold tracking-wider mb-1">Produto</p>
                        <p class="text-sm text-slate-900 font-bold">${p.nome}</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p class="text-[10px] text-slate-500 uppercase font-extrabold tracking-wider mb-1">Finalidade</p>
                        <p class="text-xs text-slate-800 font-bold leading-relaxed">${p.destino.funcao}</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p class="text-[10px] text-slate-500 uppercase font-extrabold tracking-wider mb-1">Local Enviado</p>
                        <p class="text-xs text-slate-800 font-bold">${p.destino.local}</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p class="text-[10px] text-slate-500 uppercase font-extrabold tracking-wider mb-1">Responsável</p>
                        <p class="text-xs text-slate-800 font-bold">${resp ? resp.nome : 'N/A'}</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p class="text-[10px] text-slate-500 uppercase font-extrabold tracking-wider mb-1">Associação</p>
                        <p class="text-xs text-slate-800 font-bold">${p.destino.associacao}</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p class="text-[10px] text-slate-500 uppercase font-extrabold tracking-wider mb-1">Ciclo Auditoria</p>
                        <p class="text-xs text-slate-800 font-bold">${p.destino.periodoChecagem}</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p class="text-[10px] text-slate-500 uppercase font-extrabold tracking-wider mb-1">Atribuído em</p>
                        <p class="text-xs text-slate-800 font-bold">${p.destino.dataAtribuicao}</p>
                    </div>
                    ${p.destino.recebido ? `
                    <div class="sm:col-span-2 bg-indigo-50 border border-indigo-300 p-4 rounded-xl flex items-center gap-3 text-indigo-900 mt-2 shadow-sm">
                        <i data-lucide="check-circle-2" class="w-6 h-6 flex-shrink-0 text-indigo-700"></i>
                        <span class="text-xs font-bold leading-relaxed">Este produto foi devidamente recebido pela instituição correspondente. Ações de edição ou revogação estão bloqueadas.</span>
                    </div>
                    ` : ''}
                </div>
            `;
            
            document.getElementById('viewDestinoContent').innerHTML = content;
            document.getElementById('modalViewDestino').classList.remove('hidden');
            lucide.createIcons();
        }

        // --- Restante dos métodos mantidos idênticos, referenciando as novas lógicas ---
        
        function handleLogin(e) {
            e.preventDefault();
            const doc = document.getElementById('loginDoc').value;
            const senha = document.getElementById('loginSenha').value;
            const btn = document.getElementById('btn-login');
            
            btn.innerHTML = '<div class="loader mx-auto"></div>';
            btn.disabled = true;

            setTimeout(() => { 
                const user = DB.users.find(u => u.rg === doc && u.senha === senha);
                if (user) {
                    if (user.bloqueado) {
                        customAlert("ERRO: Usuário bloqueado no sistema. Contate a administração.", "Acesso Recusado");
                        btn.innerHTML = 'Acessar Sistema';
                        btn.disabled = false;
                        return;
                    }
                    state.currentUser = user;
                    logActivity(`Login efetuado no sistema`, 'Acesso');
                    navigate('dashboard');
                    showToast('Autenticação de 2 fatores validada!');
                } else {
                    customAlert("Documento ou senha incorretos.", "Erro ao Autenticar");
                    btn.innerHTML = 'Acessar Sistema';
                    btn.disabled = false;
                }
            }, 800);
        }

        function handleLogout() {
            logActivity(`Logout efetuado do sistema`, 'Acesso');
            state.currentUser = null;
            navigate('login');
        }

        function toggleBlockUser(id) {
            const user = DB.users.find(u => u.id === id);
            if(user) {
                user.bloqueado = !user.bloqueado;
                logActivity(`${user.bloqueado ? 'Bloqueou' : 'Desbloqueou'} o usuário ID ${id} (${user.nome})`, 'Bloqueio');
                showToast(`Status do usuário alterado com sucesso.`);
                render(); 
            }
        }

        function openModalUser(id = null) {
            state.editingId = id;
            document.getElementById('formUser').reset();
            const title = document.getElementById('modalUserTitle');
            if (id) {
                const u = DB.users.find(x => x.id === id);
                title.innerText = "Editar Usuário";
                document.getElementById('nu-nome').value = u.nome;
                document.getElementById('nu-rg').value = u.rg;
                document.getElementById('nu-senha').value = u.senha;
                document.getElementById('nu-nivel').value = u.nivel;
                document.getElementById('nu-assoc').value = u.associacao;
                document.getElementById('nu-local').value = u.local;
            } else {
                title.innerText = "Cadastrar Novo Usuário";
            }
            document.getElementById('modalUser').classList.remove('hidden');
        }

        async function deleteUser(id) {
            if(id === state.currentUser.id) return showToast("Ação inválida: você está logado nesta conta.", "error");
            
            const confirmed = await customConfirm("Tem certeza que deseja remover este usuário permanentemente?", "Excluir Usuário", true);
            if(confirmed) {
                DB.users = DB.users.filter(u => u.id !== id);
                logActivity(`Removeu o usuário ID ${id}`, 'Exclusão');
                showToast('Usuário removido com sucesso.');
                render();
            }
        }

        function handleSaveUser(e) {
            e.preventDefault();
            const nome = document.getElementById('nu-nome').value;
            const nivel = parseInt(document.getElementById('nu-nivel').value);
            const senha = document.getElementById('nu-senha').value;
            
            if (state.editingId) {
                const u = DB.users.find(x => x.id === state.editingId);
                if(u) {
                    u.nome = nome;
                    u.rg = document.getElementById('nu-rg').value;
                    u.senha = senha;
                    u.nivel = nivel;
                    u.associacao = document.getElementById('nu-assoc').value;
                    u.local = document.getElementById('nu-local').value;
                    logActivity(`Editou usuário ID ${u.id}: ${nome}`, 'Edição');
                    showToast('Usuário atualizado com sucesso.');
                }
            } else {
                DB.users.push({
                    id: DB.users.length > 0 ? Math.max(...DB.users.map(u=>u.id)) + 1 : 1,
                    nome: nome,
                    rg: document.getElementById('nu-rg').value,
                    senha: senha,
                    nivel: nivel,
                    bloqueado: false,
                    foto: "",
                    associacao: document.getElementById('nu-assoc').value,
                    local: document.getElementById('nu-local').value,
                    criacao: new Date().toISOString().split('T')[0]
                });
                logActivity(`Cadastrou novo usuário: ${nome} (Nível ${nivel})`, 'Cadastro');
                showToast('Usuário cadastrado com sucesso.');
            }
            document.getElementById('modalUser').classList.add('hidden');
            render();
        }

        function openModalProduto(id = null) {
            state.editingId = id;
            document.getElementById('formProduto').reset();
            const title = document.getElementById('modalProdutoTitle');
            if (id) {
                const p = DB.produtos.find(x => x.id === id);
                title.innerText = "Editar Produto Apreendido";
                document.getElementById('np-nome').value = p.nome;
                document.getElementById('np-class').value = p.classificacao;
                document.getElementById('np-data').value = p.dataApreensao;
                document.getElementById('np-local').value = p.localizacao;
                document.getElementById('np-motivo').value = p.motivo;
                document.getElementById('np-lote').checked = p.emLote;
                document.getElementById('np-qtd-container').classList.toggle('hidden', !p.emLote);
                document.getElementById('np-qtd').value = p.quantidade;
            } else {
                title.innerText = "Registrar Produto Apreendido";
                document.getElementById('np-qtd-container').classList.add('hidden');
            }
            document.getElementById('modalProduto').classList.remove('hidden');
        }

        async function deleteProduto(id) {
            const confirmed = await customConfirm("Tem certeza que deseja remover este produto permanentemente?", "Excluir Produto", true);
            if(confirmed) {
                DB.produtos = DB.produtos.filter(p => p.id !== id);
                logActivity(`Removeu o produto ID ${id}`, 'Exclusão Produto');
                showToast('Produto removido com sucesso.');
                render();
            }
        }

        function handleSaveProduto(e) {
            e.preventDefault();
            const isLote = document.getElementById('np-lote').checked;
            const nome = document.getElementById('np-nome').value;
            if (state.editingId) {
                const p = DB.produtos.find(x => x.id === state.editingId);
                if(p) {
                    p.nome = nome;
                    p.classificacao = document.getElementById('np-class').value;
                    p.localizacao = document.getElementById('np-local').value;
                    p.dataApreensao = document.getElementById('np-data').value;
                    p.motivo = document.getElementById('np-motivo').value;
                    p.emLote = isLote;
                    p.quantidade = isLote ? document.getElementById('np-qtd').value : 1;
                    logActivity(`Editou produto ID ${p.id}: ${nome}`, 'Edição Produto');
                    showToast('Produto atualizado com sucesso.');
                }
            } else {
                DB.produtos.push({
                    id: Math.floor(Math.random() * 1000) + 200,
                    nome: nome,
                    classificacao: document.getElementById('np-class').value,
                    localizacao: document.getElementById('np-local').value,
                    dataApreensao: document.getElementById('np-data').value,
                    motivo: document.getElementById('np-motivo').value,
                    emLote: isLote,
                    quantidade: isLote ? document.getElementById('np-qtd').value : 1,
                    destino: null
                });
                logActivity(`Registrou apreensão de produto: ${nome}`, 'Cadastro Produto');
                showToast('Produto registrado com sucesso.');
            }
            document.getElementById('modalProduto').classList.add('hidden');
            render();
        }

        function openModalDestino(prodId, isEdit = false) {
            const p = DB.produtos.find(x => x.id === prodId);
            if(!p) return;
            state.editingId = isEdit ? prodId : null;
            document.getElementById('formDestino').reset();
            document.getElementById('nd-prodId').value = p.id;
            document.getElementById('nd-prodInfo').innerHTML = `<strong>Produto:</strong> ${p.nome} (ID: ${p.id})`;
            
            if (isEdit && p.destino) {
                document.getElementById('nd-funcao').value = p.destino.funcao;
                document.getElementById('nd-local').value = p.destino.local;
                if(document.querySelector(`#nd-user option[value="${p.destino.usuarioId}"]`)){
                    document.getElementById('nd-user').value = p.destino.usuarioId;
                }
                document.getElementById('nd-periodo').value = p.destino.periodoChecagem;
            }
            document.getElementById('modalDestino').classList.remove('hidden');
        }

        async function deleteDestino(prodId) {
            const confirmed = await customConfirm("Tem certeza que deseja revogar a destinação deste produto? Ele retornará ao status 'Em Depósito'.", "Revogar Destinação", true);
            if(confirmed) {
                const p = DB.produtos.find(x => x.id === prodId);
                if(p) {
                    p.destino = null;
                    logActivity(`Revogou a destinação do produto ID ${prodId}`, 'Revogação Destino');
                    showToast('Destinação revogada com sucesso.');
                    render();
                }
            }
        }

        async function handleSaveDestino(e) {
            e.preventDefault();
            const confirmed = await customConfirm("Tem certeza que deseja confirmar os dados desta destinação?", "Confirmar Destinação");
            if(!confirmed) return;

            const prodId = parseInt(document.getElementById('nd-prodId').value);
            const p = DB.produtos.find(x => x.id === prodId);
            const userId = parseInt(document.getElementById('nd-user').value);
            const user = DB.users.find(u => u.id === userId);
            
            if(p && user) {
                const isEdit = !!state.editingId;
                p.destino = {
                    local: document.getElementById('nd-local').value,
                    funcao: document.getElementById('nd-funcao').value,
                    usuarioId: user.id,
                    associacao: user.associacao,
                    periodoChecagem: document.getElementById('nd-periodo').value,
                    dataAtribuicao: isEdit ? p.destino.dataAtribuicao : new Date().toLocaleDateString('pt-BR'),
                    recebido: false 
                };
                logActivity(`${isEdit ? 'Editou' : 'Atribuiu'} destino ao produto ID ${p.id}`, 'Destinação');
                showToast(`Destinação ${isEdit ? 'atualizada' : 'atribuída'} com sucesso.`);
                document.getElementById('modalDestino').classList.add('hidden');
                render();
            }
        }

        async function marcarRecebido(prodId) {
            const confirmed = await customConfirm("Marcar como RECEBIDO? \n\nEsta ação finaliza o processo de trânsito. A edição e revogação do destino serão desativadas permanentemente para segurança institucional.", "Confirmar Recebimento");
            if(confirmed) {
                const p = DB.produtos.find(x => x.id === prodId);
                if(p && p.destino) {
                    p.destino.recebido = true;
                    logActivity(`Confirmou recebimento do produto ID ${p.id}`, 'Atualização Status');
                    showToast('Produto recebido com sucesso!');
                    render();
                }
            }
        }

        function openModalAssociacao(id = null) {
            state.editingId = id;
            document.getElementById('formAssociacao').reset();
            const title = document.getElementById('modalAssociacaoTitle');
            if (id) {
                const a = DB.associacoes.find(x => x.id === id);
                title.innerText = "Editar Associação";
                document.getElementById('na-nome').value = a.nome;
                document.getElementById('na-ramo').value = a.ramo;
                document.getElementById('na-lider').value = a.lider;
                document.getElementById('na-operacao').value = a.localOperacao;
                document.getElementById('na-fundacao').value = a.localFundacao;
                document.getElementById('na-lucrativo').checked = a.lucrativo;
            } else {
                title.innerText = "Cadastrar Nova Associação";
            }
            document.getElementById('modalAssociacao').classList.remove('hidden');
        }

        async function deleteAssociacao(id) {
            const confirmed = await customConfirm("Tem certeza que deseja remover esta associação permanentemente?", "Excluir Associação", true);
            if(confirmed) {
                DB.associacoes = DB.associacoes.filter(a => a.id !== id);
                logActivity(`Removeu a associação ID ${id}`, 'Exclusão Associação');
                showToast('Associação removida com sucesso.');
                render();
            }
        }

        function handleSaveAssociacao(e) {
            e.preventDefault();
            const nome = document.getElementById('na-nome').value;
            if (state.editingId) {
                const a = DB.associacoes.find(x => x.id === state.editingId);
                if (a) {
                    a.nome = nome;
                    a.ramo = document.getElementById('na-ramo').value;
                    a.lucrativo = document.getElementById('na-lucrativo').checked;
                    a.localFundacao = document.getElementById('na-fundacao').value;
                    a.lider = document.getElementById('na-lider').value;
                    a.localOperacao = document.getElementById('na-operacao').value;
                    logActivity(`Editou associação/órgão ID ${a.id}: ${nome}`, 'Edição Associação');
                    showToast('Associação atualizada com sucesso.');
                }
            } else {
                DB.associacoes.push({
                    id: DB.associacoes.length > 0 ? Math.max(...DB.associacoes.map(a=>a.id)) + 1 : 1,
                    nome: nome,
                    ramo: document.getElementById('na-ramo').value,
                    lucrativo: document.getElementById('na-lucrativo').checked,
                    localFundacao: document.getElementById('na-fundacao').value,
                    lider: document.getElementById('na-lider').value,
                    localOperacao: document.getElementById('na-operacao').value,
                    preCadastrado: false
                });
                logActivity(`Cadastrou nova associação/órgão: ${nome}`, 'Cadastro Associação');
                showToast('Associação cadastrada com sucesso.');
            }
            document.getElementById('modalAssociacao').classList.add('hidden');
            render();
        }

        function render() {
            const container = document.getElementById('app-container');
            if (state.currentView === 'login' || !state.currentUser) {
                container.innerHTML = renderLogin();
            } else {
                let mainContent = '';
                switch(state.currentView) {
                    case 'dashboard': mainContent = renderDashboard(); break;
                    case 'usuarios': mainContent = renderUsuarios(); break;
                    case 'produtos': mainContent = renderProdutos(); break;
                    case 'auditoria': mainContent = renderAuditoria(); break;
                    case 'associacoes': mainContent = renderAssociacoes(); break;
                    case 'destinacao': mainContent = renderDestinacao(); break;
                    default: mainContent = renderDashboard();
                }
                container.innerHTML = `${renderSidebar()}${mainContent}`;
            }
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => { render(); });
    </script>
</body>
</html>
